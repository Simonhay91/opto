<div class="product-card group border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-cyan-400 dark:hover:border-cyan-500 transition-all duration-300 overflow-hidden flex flex-col h-full"
     [attr.data-testid]="'product-card-' + product.slug">

  <!-- Image -->
  <a (click)="navigateToProduct($event)" href="#" class="block overflow-hidden aspect-square bg-slate-50 dark:bg-slate-800 relative cursor-pointer">
    <img [src]="mainImage" [alt]="product.name"
         class="card-img w-full h-full object-contain p-4 transition-transform duration-500"
         loading="lazy"
         (error)="$any($event.target).src='/assets/no-image.png'">
    <!-- Badges -->
    <div class="absolute top-2 left-2 flex flex-col gap-1">
      @if (product.isHot) { <span class="badge-hot">HOT</span> }
      @if (product.isNew) { <span class="badge-new">NEW</span> }
      @if (product.isDiscontinued) { <span class="badge-disc">DISC</span> }
    </div>
    <!-- In Cart badge -->
    @if (isInCart) {
      <div class="absolute top-2 right-2 bg-green-500 text-white text-xs font-bold px-2 py-0.5">
        IN CART
      </div>
    }
  </a>

  <!-- Info -->
  <div class="p-3 flex flex-col flex-1 gap-1">
    <!-- Code -->
    @if (product.crmCode || product.model) {
      <span class="text-xs font-mono text-slate-400 dark:text-slate-500 uppercase tracking-wider">{{product.crmCode || product.model}}</span>
    }
    <!-- Model -->
    @if (product.model) {
      <p class="text-xs font-mono text-cyan-500 uppercase tracking-wide truncate">{{product.model}}</p>
    }
    <!-- Name -->
    <a (click)="navigateToProduct($event)" href="#"
       class="text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug line-clamp-2 hover:text-cyan-500 transition-colors flex-1 cursor-pointer">
      {{product.name}}
    </a>

    <!-- CTA Buttons -->
    <div class="flex gap-2 mt-2">
      <button (click)="addToCart($event)"
         [class]="'flex-1 text-center text-xs font-bold uppercase tracking-wide py-2 transition-all duration-200 ' + (addedToCart() ? 'bg-green-500 text-white' : isInCart ? 'bg-slate-100 dark:bg-slate-800 text-slate-500' : 'border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:border-cyan-500 hover:text-cyan-500')"
         data-testid="product-card-add-cart">
        @if (addedToCart()) {
          Added!
        } @else if (isInCart) {
          In Cart
        } @else {
          + Cart
        }
      </button>
      <button (click)="quoteOpen.set(true); $event.preventDefault()"
         class="flex-1 text-center text-xs font-bold uppercase tracking-wide py-2 bg-cyan-500 text-white hover:bg-cyan-600 transition-all duration-200"
         data-testid="product-card-quote-btn">
        Quote
      </button>
    </div>
  </div>
</div>

<!-- Quote Modal -->
@if (quoteOpen()) {
  <app-quote-modal [product]="product" (closed)="quoteOpen.set(false)" />
}
