<div class="product-card group border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-cyan-400 dark:hover:border-cyan-500 transition-all duration-300 overflow-hidden flex flex-col h-full"
     [attr.data-testid]="'product-card-' + product.slug">

  <!-- Image -->
  <a [routerLink]="['/product', product.slug]" class="block overflow-hidden aspect-square bg-slate-50 dark:bg-slate-800 relative">
    <img [src]="mainImage" [alt]="product.name"
         class="card-img w-full h-full object-contain p-4 transition-transform duration-500"
         loading="lazy"
         (error)="$any($event.target).src='/assets/no-image.png'">
    <!-- Badges -->
    <div class="absolute top-2 left-2 flex flex-col gap-1">
      @if (product.isHot) { <span class="badge-hot">HOT</span> }
      @if (product.isNew) { <span class="badge-new">NEW</span> }
      @if (product.isDiscontinued) { <span class="badge-disc">DISC</span> }
    </div>
    <!-- Stock overlay -->
    @if (!inStock) {
      <div class="absolute inset-0 bg-slate-900/40 flex items-center justify-center">
        <span class="text-xs font-bold uppercase text-white bg-slate-700 px-2 py-1">{{lang.t('outOfStock')}}</span>
      </div>
    }
  </a>

  <!-- Info -->
  <div class="p-3 flex flex-col flex-1 gap-1">
    <!-- Code -->
    @if (product.crmCode) {
      <span class="text-xs font-mono text-slate-400 dark:text-slate-500 uppercase tracking-wider">#{{product.crmCode}}</span>
    }
    <!-- Model -->
    @if (product.model) {
      <p class="text-xs font-mono text-cyan-500 uppercase tracking-wide truncate">{{product.model}}</p>
    }
    <!-- Name -->
    <a [routerLink]="['/product', product.slug]"
       class="text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug line-clamp-2 hover:text-cyan-500 transition-colors flex-1">
      {{product.name}}
    </a>
    <!-- Price -->
    @if (price) {
      <p class="text-sm font-bold text-slate-900 dark:text-slate-100 mt-1">{{price}}</p>
    }

    <!-- CTA -->
    <a [routerLink]="['/product', product.slug]"
       class="mt-2 w-full text-center text-xs font-bold uppercase tracking-wide py-2 border border-cyan-500 text-cyan-500 hover:bg-cyan-500 hover:text-white transition-all duration-200"
       data-testid="product-card-quote-btn">
      {{lang.t('getQuote')}}
    </a>
  </div>
</div>
