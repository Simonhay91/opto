<div class="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col" data-testid="not-found-page">

  <!-- Top accent line -->
  <div class="h-1 bg-gradient-to-r from-cyan-400 via-cyan-500 to-cyan-600"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-20">
    <div class="max-w-lg w-full text-center">

      <!-- 404 number with optical fiber effect -->
      <div class="relative mb-8 select-none" data-testid="error-code">
        <span class="text-[140px] sm:text-[180px] font-heading font-black leading-none
                     text-transparent bg-clip-text
                     bg-gradient-to-br from-slate-200 to-slate-300
                     dark:from-slate-700 dark:to-slate-800">
          404
        </span>
        <!-- Cyan accent line across the numbers -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="w-full h-0.5 bg-cyan-500 opacity-60"></div>
        </div>
      </div>

      <!-- Icon -->
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 rounded-full bg-cyan-50 dark:bg-cyan-900/30
                    border-2 border-cyan-200 dark:border-cyan-800
                    flex items-center justify-center">
          <svg class="w-8 h-8 text-cyan-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/>
          </svg>
        </div>
      </div>

      <!-- Text -->
      <h1 class="text-2xl sm:text-3xl font-heading font-bold text-slate-800 dark:text-slate-100 mb-3">
        Page Not Found
      </h1>
      <p class="text-slate-500 dark:text-slate-400 text-base mb-10 leading-relaxed">
        The page you're looking for doesn't exist or has been moved.<br>
        Let's get you back on track.
      </p>

      <!-- Actions -->
      <div class="flex flex-col sm:flex-row gap-3 justify-center" data-testid="not-found-actions">
        <a routerLink="/"
           class="inline-flex items-center justify-center gap-2 px-6 py-3
                  bg-cyan-500 hover:bg-cyan-600 text-white font-semibold
                  rounded-none transition-colors duration-200"
           data-testid="back-home-btn">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          Go to Homepage
        </a>
        <a routerLink="/catalog"
           class="inline-flex items-center justify-center gap-2 px-6 py-3
                  border-2 border-slate-300 dark:border-slate-600
                  text-slate-700 dark:text-slate-300
                  hover:border-cyan-500 hover:text-cyan-500
                  font-semibold rounded-none transition-colors duration-200"
           data-testid="browse-catalog-btn">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z"/>
          </svg>
          Browse Products
        </a>
      </div>

      <!-- Quick links -->
      <div class="mt-12 pt-8 border-t border-slate-200 dark:border-slate-700">
        <p class="text-xs font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-4">
          Quick Links
        </p>
        <div class="flex flex-wrap justify-center gap-x-6 gap-y-2">
          <a routerLink="/about" class="text-sm text-slate-500 hover:text-cyan-500 dark:text-slate-400 dark:hover:text-cyan-400 transition-colors">About</a>
          <a routerLink="/blog" class="text-sm text-slate-500 hover:text-cyan-500 dark:text-slate-400 dark:hover:text-cyan-400 transition-colors">Blog</a>
          <a routerLink="/faq" class="text-sm text-slate-500 hover:text-cyan-500 dark:text-slate-400 dark:hover:text-cyan-400 transition-colors">FAQ</a>
          <a routerLink="/contact" class="text-sm text-slate-500 hover:text-cyan-500 dark:text-slate-400 dark:hover:text-cyan-400 transition-colors">Contact</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom accent -->
  <div class="h-1 bg-gradient-to-r from-cyan-600 via-cyan-500 to-cyan-400"></div>
</div>
